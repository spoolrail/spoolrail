services:
  rabbitmq:
    image: rabbitmq:4.3.3-management
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    ports:
      - "${SPOOLRAIL_RABBITMQ_PORT:-5672}:5672"
      - "${SPOOLRAIL_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 2s
      timeout: 5s
      retries: 30

  aws:
    image: ministackorg/ministack:1.4.14
    ports:
      - "${SPOOLRAIL_AWS_PORT:-4566}:4566"
    # MiniStack includes a built-in image health check.

  gcloud:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:579.0.0-emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=spoolrail
    ports:
      - "${SPOOLRAIL_GCLOUD_PORT:-8085}:8085"
    healthcheck:
      test: curl -fsS http://localhost:8085/v1/projects/spoolrail/topics
      interval: 2s
      timeout: 5s
      retries: 30
